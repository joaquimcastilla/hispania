name: Phase 2.1-V3 RC1 migration acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - codex/hispania-0.7.0-step2-1-production-readiness

permissions:
  contents: read

jobs:
  migration-acceptance:
    if: github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: phase21v2-migration-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Set reproducible source commit timestamp
        shell: pwsh
        run: |
          $epoch = (git show -s --format=%ct $env:GITHUB_SHA).Trim()
          if ($LASTEXITCODE -ne 0 -or $epoch -notmatch '^\d+$') { throw 'Could not determine the checked-out commit timestamp.' }
          "HISPANIA_SOURCE_COMMIT_EPOCH=$epoch" >> $env:GITHUB_ENV
      - name: Install and verify Complete RC1 media prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            choco install ffmpeg --version=9.0.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg installation failed.' }
            $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
            $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          } else {
            sudo apt-get update
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the Ubuntu package index for the RC1 prerequisite.' }
            sudo apt-get install --yes ffmpeg
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
            $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
            $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          }
          foreach ($tool in @(@{Name='ffprobe';Path=$ffprobe}, @{Name='ffmpeg';Path=$ffmpeg})) {
            if (-not [IO.Path]::IsPathFullyQualified($tool.Path) -or -not (Test-Path -LiteralPath $tool.Path -PathType Leaf)) { throw "Invalid $($tool.Name) executable path." }
            $version = & $tool.Path -version 2>&1 | Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace([string]$version)) { throw "$($tool.Name) did not execute successfully." }
            "- $($tool.Name): $version ($($tool.Path))" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          "HISPANIA_TEST_FFPROBE_PATH=$ffprobe" >> $env:GITHUB_ENV
          "HISPANIA_TEST_FFMPEG_PATH=$ffmpeg" >> $env:GITHUB_ENV
      - name: Execute pinned RC1 migration acceptance and preserve evidence
        shell: pwsh
        run: ./tools/test-phase21v2-migration.ps1 -ResultsDirectory .artifacts/phase21v2-${{ runner.os }}
      - name: Upload migration logs, hashes, test results, and published fixture
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase21v3-migration-${{ runner.os }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          path: .artifacts/phase21v2-${{ runner.os }}
