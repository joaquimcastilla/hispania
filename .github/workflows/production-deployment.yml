name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the exact Step 2.1 candidate commit to validate.
        required: true
        type: string
      hosted_scm_acceptance:
        description: Run only the isolated GitHub-hosted Windows SCM acceptance job.
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ inputs.hosted_scm_acceptance && 'phase21-hosted-windows-scm' || 'phase21-self-hosted' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-production:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha && inputs.hosted_scm_acceptance != true
    runs-on: [self-hosted, hispania, hispania-linux]
    env:
      HISPANIA_PHASE18_SERVICE_ROOT: /opt/hispania-phase18-ci
      HISPANIA_PHASE21_NATIVE_HELPER: /usr/local/sbin/hispania-phase21-service
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install native Media and offline backup prerequisites
        shell: pwsh
        env:
          HISPANIA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HISPANIA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: ./tools/ci/self-hosted-preflight.ps1
      - run: npm ci
        working-directory: apps/web
      - name: Audit current production dependencies
        run: npm audit --omit=dev
        working-directory: apps/web
      - name: Publish actual linux-x64 production artifact
        shell: pwsh
        run: ./tools/publish-production.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase18/linux-x64
      - name: Provision fake secret classes and verify production logger redaction
        shell: pwsh
        run: dotnet test tests/deployment/Hispania.Deployment.Tests.csproj --filter FullyQualifiedName~Phase21SecretCanary --results-directory .artifacts/phase18/evidence --logger "trx;LogFileName=secret-canaries.trx"
      - name: Archive and checksum linux-x64 artifact
        shell: pwsh
        run: |
          tar -czf .artifacts/phase18/linux-x64.tar.gz -C .artifacts/phase18/linux-x64 .
          if ($LASTEXITCODE -ne 0) { throw 'Artifact archive failed.' }
          (Get-FileHash .artifacts/phase18/linux-x64.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content .artifacts/phase18/linux-x64.tar.gz.sha256
      - name: Publish exact archived Phase 17 predecessor
        shell: pwsh
        run: ./tools/publish-phase17-predecessor.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase18/predecessor-linux-x64
      - name: Publish exact Phase 19 Web predecessor
        shell: pwsh
        run: ./tools/publish-phase19-predecessor.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase20/predecessor-linux-x64
      - name: Require clean-host, real systemd Server and Worker, rotation, upgrade and disaster recovery
        shell: pwsh
        run: |
          ./tools/test-phase18-production-deployment.ps1 -ArtifactDirectory .artifacts/phase18/linux-x64 -PredecessorDirectory .artifacts/phase18/predecessor-linux-x64 -WebPredecessorDirectory .artifacts/phase20/predecessor-linux-x64 -ResultsDirectory .artifacts/phase18/evidence -RequirePostgreSql -RequireNativeService 2>&1 | Tee-Object -FilePath .artifacts/phase18/production-gate.log
      - name: Scan production artifacts and captured local outputs for secret canaries
        if: always()
        shell: pwsh
        run: ./tools/test-security-canaries.ps1 -EvidenceDirectory .artifacts/phase18 -ArtifactDirectory .artifacts/phase18/linux-x64
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase18-linux-evidence
          path: |
            .artifacts/phase18/evidence
            .artifacts/phase18/*.build-evidence.json
            .artifacts/phase18/*.manifest.sha256
            .artifacts/phase18/linux-x64/artifact-manifest.json
            .artifacts/phase18/*.npm-audit.json
            .artifacts/phase18/linux-x64.tar.gz*

  windows-production:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha && inputs.hosted_scm_acceptance != true
    runs-on: [self-hosted, hispania, hispania-windows, hispania-windows-scm-isolated]
    env:
      HISPANIA_PHASE18_SERVICE_ROOT: C:\ProgramData\HispaniaPhase18CI
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install FFmpeg tools
        shell: pwsh
        env:
          HISPANIA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HISPANIA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          ./tools/ci/self-hosted-preflight.ps1
      - name: Check protected Windows SCM helper and isolation
        id: windows-scm
        shell: pwsh
        env:
          HISPANIA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HISPANIA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          HISPANIA_PHASE21_APPROVAL_MANIFEST: C:\ProgramData\HispaniaPhase21CI\active-approval.json
        run: |
          $ErrorActionPreference = 'Stop'
          "enabled=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          try {
            $protectedRoot = 'C:\ProgramData\HispaniaPhase21CI'
            if ([Security.Principal.WindowsIdentity]::GetCurrent().User.Value -ne 'S-1-5-20') { throw 'Windows runner identity is not the expected NetworkService account.' }
            $candidateNative = (Get-Content -LiteralPath './tools/ci/windows-native-service-helper.ps1' -Raw).Replace("`r`n", "`n")
            $candidateService = (Get-Content -LiteralPath './deployment/windows-service.ps1' -Raw).Replace("`r`n", "`n")
            $encoding = [Text.UTF8Encoding]::new($false)
            $nativeHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($encoding.GetBytes($candidateNative))).ToLowerInvariant()
            $serviceHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($encoding.GetBytes($candidateService))).ToLowerInvariant()
            $manifestPath = [IO.Path]::GetFullPath($env:HISPANIA_PHASE21_APPROVAL_MANIFEST)
            $generationRoot = Join-Path (Join-Path $protectedRoot 'approved') $env:HISPANIA_CANDIDATE_SHA
            $nativePath = Join-Path $generationRoot 'windows-native-service-helper.ps1'
            $servicePath = Join-Path $generationRoot 'windows-service.ps1'
            $writeMask = [Security.AccessControl.FileSystemRights]::Write -bor [Security.AccessControl.FileSystemRights]::Modify -bor [Security.AccessControl.FileSystemRights]::FullControl -bor [Security.AccessControl.FileSystemRights]::CreateFiles -bor [Security.AccessControl.FileSystemRights]::CreateDirectories -bor [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor [Security.AccessControl.FileSystemRights]::ChangePermissions -bor [Security.AccessControl.FileSystemRights]::TakeOwnership
            $privilegedWriteSids = @('S-1-5-18','S-1-5-32-544')
            function Assert-ApprovedProtectedPath([string]$Path, [switch]$Directory) {
              $item = Get-Item -LiteralPath $Path -Force
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or ($Directory -and -not $item.PSIsContainer) -or (-not $Directory -and $item.PSIsContainer)) { throw "Protected path has an unexpected type or reparse point: $Path" }
              $ancestor = [IO.Path]::GetFullPath($Path)
              while ($ancestor) {
                if (Test-Path -LiteralPath $ancestor) {
                  $ancestorItem = Get-Item -LiteralPath $ancestor -Force
                  if ($ancestorItem.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw "Protected path traverses a reparse point: $ancestor" }
                }
                if ($ancestor -eq [IO.Path]::GetPathRoot($ancestor).TrimEnd('\')) { break }
                $ancestor = [IO.Path]::GetDirectoryName($ancestor)
              }
              $acl = Get-Acl -LiteralPath $Path
              $ownerSid = ([Security.Principal.NTAccount]::new($acl.Owner)).Translate([Security.Principal.SecurityIdentifier]).Value
              if ($ownerSid -notin @('S-1-5-18','S-1-5-32-544')) { throw "Protected path owner is not SYSTEM or Administrators: $Path" }
              if (-not $acl.AreAccessRulesProtected) { throw "Protected path DACL inherits from an unpinned parent: $Path" }
              foreach ($rule in $acl.Access) {
                if ($rule.AccessControlType -ne [Security.AccessControl.AccessControlType]::Allow) { continue }
                $sid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
                $rights = [Security.AccessControl.FileSystemRights]$rule.FileSystemRights
                if (($rights -band $writeMask) -ne 0 -and $sid -notin $privilegedWriteSids) { throw "Protected path grants write access outside SYSTEM/Administrators: $Path" }
              }
              return $acl
            }

            $null = Assert-ApprovedProtectedPath $protectedRoot -Directory
            $null = Assert-ApprovedProtectedPath (Join-Path $protectedRoot 'approved') -Directory
            $null = Assert-ApprovedProtectedPath $generationRoot -Directory
            $null = Assert-ApprovedProtectedPath $manifestPath
            $null = Assert-ApprovedProtectedPath $nativePath
            $null = Assert-ApprovedProtectedPath $servicePath

            # Lock the manifest and both executable snapshots before hashing. A
            # read-only handle denies write/delete opens until the always-cleanup step.
            $readyFile = Join-Path $env:RUNNER_TEMP ("hispania-scm-lock-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json")
            $lockScript = (Resolve-Path './tools/ci/hold-windows-scm-generation.ps1').Path
            $pwshPath = (Get-Command pwsh -ErrorAction Stop).Source
            $quote = { param([string]$Value) '"' + $Value.Replace('"','""') + '"' }
            $arguments = @('-NoProfile','-NonInteractive','-File',(& $quote $lockScript),'-ReadyFile',(& $quote $readyFile),'-Path',(& $quote $manifestPath),'-Path',(& $quote $nativePath),'-Path',(& $quote $servicePath)) -join ' '
            $locker = Start-Process -FilePath $pwshPath -ArgumentList $arguments -PassThru -WindowStyle Hidden
            "HISPANIA_PHASE21_LOCKER_PID=$($locker.Id)" | Add-Content -LiteralPath $env:GITHUB_ENV
            "HISPANIA_PHASE21_LOCKER_READY_FILE=$readyFile" | Add-Content -LiteralPath $env:GITHUB_ENV
            $lockDeadline = [DateTime]::UtcNow.AddSeconds(15)
            while (-not (Test-Path -LiteralPath $readyFile) -and [DateTime]::UtcNow -lt $lockDeadline) {
              if ($locker.HasExited) { throw 'Protected helper generation lock process exited before acquiring all locks.' }
              Start-Sleep -Milliseconds 200
            }
            if (-not (Test-Path -LiteralPath $readyFile)) { throw 'Timed out acquiring protected helper generation locks.' }
            $lockRecord = Get-Content -LiteralPath $readyFile -Raw | ConvertFrom-Json
            if ([int]$lockRecord.processId -ne $locker.Id -or $lockRecord.runId -cne $env:GITHUB_RUN_ID -or $lockRecord.runAttempt -cne $env:GITHUB_RUN_ATTEMPT) { throw 'Protected generation lock ownership record does not match this workflow run.' }
            $manifestLockedHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.schemaVersion -ne 1 -or $manifest.repository -cne 'joaquimcastilla/hispania' -or $manifest.sourceSha -cne $env:HISPANIA_CANDIDATE_SHA -or $manifest.sourceSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Protected approval manifest does not authorize this exact repository and candidate SHA.' }
            if ($manifest.approvalId -cnotmatch '^[A-Za-z0-9._/-]{1,80}$' -or [string]::IsNullOrWhiteSpace([string]$manifest.approvalReference) -or [string]::IsNullOrWhiteSpace([string]$manifest.approvedByWindows) -or [string]::IsNullOrWhiteSpace([string]$manifest.approvedByGitHub)) { throw 'Independent approval metadata is incomplete.' }
            if ($manifest.approvedByGitHub -cnotmatch '^[A-Za-z0-9-]{1,39}$' -or [string]::IsNullOrWhiteSpace([string]$manifest.brokerOwnerSid)) { throw 'Approval identity metadata is malformed.' }
            if ($manifest.approvedByGitHub -ieq $env:HISPANIA_TRIGGERING_ACTOR) { throw 'Helper approval must come from a different GitHub identity than the workflow actor.' }
            if ($manifest.hostIsolationVerified -ne $true -or $manifest.runnerHost -ine $env:COMPUTERNAME -or [string]::IsNullOrWhiteSpace([string]$manifest.hostIsolationEvidence)) { throw 'This runner host is not recorded as independently verified and isolated.' }
            $approvalTime = [DateTimeOffset]::Parse([string]$manifest.approvedAtUtc).ToUniversalTime()
            if ($approvalTime -gt [DateTimeOffset]::UtcNow.AddMinutes(5) -or $approvalTime -lt [DateTimeOffset]::UtcNow.AddDays(-30)) { throw 'Helper approval timestamp is invalid, future-dated, or older than 30 days.' }
            if ($manifest.nativeHelperSha256 -cne $nativeHash -or $manifest.windowsServiceSha256 -cne $serviceHash) { throw 'Approval manifest hashes do not match the candidate source.' }
            $null = Assert-ApprovedProtectedPath $protectedRoot -Directory
            $null = Assert-ApprovedProtectedPath (Join-Path $protectedRoot 'approved') -Directory
            $null = Assert-ApprovedProtectedPath $generationRoot -Directory
            $null = Assert-ApprovedProtectedPath $manifestPath
            $null = Assert-ApprovedProtectedPath $nativePath
            $null = Assert-ApprovedProtectedPath $servicePath

            $protectedNative = (Get-Content -LiteralPath $nativePath -Raw).Replace("`r`n", "`n")
            $protectedService = (Get-Content -LiteralPath $servicePath -Raw).Replace("`r`n", "`n")
            $protectedNativeHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($encoding.GetBytes($protectedNative))).ToLowerInvariant()
            $protectedServiceHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($encoding.GetBytes($protectedService))).ToLowerInvariant()
            if ($protectedNativeHash -cne $nativeHash -or $protectedServiceHash -cne $serviceHash) { throw 'Protected helper generation differs from the approved candidate source.' }

            $brokerProcesses = @(Get-CimInstance Win32_Process -Filter "Name='pwsh.exe'" | Where-Object { $_.CommandLine -and $_.CommandLine.IndexOf($nativePath,[StringComparison]::OrdinalIgnoreCase) -ge 0 -and $_.CommandLine -match '(?i)(?:^|\s)-Server(?:\s|$)' })
            if ($brokerProcesses.Count -ne 1) { throw "Expected one active elevated broker from the approved immutable helper generation; found $($brokerProcesses.Count)." }
            $broker = $brokerProcesses[0]
            $brokerOwner = Invoke-CimMethod -InputObject $broker -MethodName GetOwnerSid -ErrorAction Stop
            if ($brokerOwner.ReturnValue -ne 0 -or $brokerOwner.Sid -cne $manifest.brokerOwnerSid -or $brokerOwner.Sid -eq 'S-1-5-20') { throw 'Active broker owner does not match the independently approved administrator identity.' }
            $brokerLog = Join-Path $generationRoot 'broker.log'
            $null = Assert-ApprovedProtectedPath $brokerLog
            $brokerRecord = @(Get-Content -LiteralPath $brokerLog -Tail 500 | Where-Object { $_ -match "kind=broker-start; pid=$($broker.ProcessId);" } | Select-Object -Last 1)
            if ($brokerRecord.Count -ne 1 -or $brokerRecord[0] -notmatch 'elevated_admin=true' -or $brokerRecord[0] -notmatch "user_sid=$([regex]::Escape($manifest.brokerOwnerSid))" -or $brokerRecord[0] -notmatch "source_sha=$($env:HISPANIA_CANDIDATE_SHA)" -or $brokerRecord[0] -notmatch "approval_id=$([regex]::Escape($manifest.approvalId))" -or $brokerRecord[0] -notmatch "native_sha256=$nativeHash" -or $brokerRecord[0] -notmatch "service_sha256=$serviceHash") { throw 'Active broker startup audit record is missing or does not match the approved generation.' }

            $manifestHash = $manifestLockedHash
            "SCM approval id=$($manifest.approvalId); approved_by=$($manifest.approvedByGitHub); source_sha=$($manifest.sourceSha); manifest_sha256=$manifestHash" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            "SCM protected helper hashes: native=$nativeHash; service=$serviceHash; runner=$env:COMPUTERNAME; broker_pid=$($broker.ProcessId); runner_identity=NetworkService" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            ./tools/ci/self-hosted-preflight.ps1
            "HISPANIA_PHASE21_NATIVE_HELPER=$nativePath" | Add-Content -LiteralPath $env:GITHUB_ENV
            "HISPANIA_PHASE21_APPROVAL_ID=$($manifest.approvalId)" | Add-Content -LiteralPath $env:GITHUB_ENV
            "enabled=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          } catch {
            "enabled=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "Windows SCM BLOCKED before any SCM operation: $($_.Exception.Message)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - run: npm ci
        working-directory: apps/web
      - name: Audit current production dependencies
        run: npm audit --omit=dev
        working-directory: apps/web
      - name: Publish actual win-x64 production artifact
        shell: pwsh
        run: ./tools/publish-production.ps1 -Rid win-x64 -OutputDirectory .artifacts/phase18/win-x64
      - name: Provision fake secret classes and verify production logger redaction
        shell: pwsh
        run: dotnet test tests/deployment/Hispania.Deployment.Tests.csproj --filter FullyQualifiedName~Phase21SecretCanary --results-directory .artifacts/phase18/evidence --logger "trx;LogFileName=secret-canaries.trx"
      - name: Verify publisher archive and checksum for win-x64 artifact
        shell: pwsh
        run: |
          $archive = '.artifacts/phase18/win-x64.zip'
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or -not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw 'The production publisher did not create its archive and checksum.' }
          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -cne $actual) { throw 'Production archive checksum does not match the publisher sidecar.' }
      - name: Publish exact archived Phase 17 predecessor
        shell: pwsh
        run: ./tools/publish-phase17-predecessor.ps1 -Rid win-x64 -OutputDirectory .artifacts/phase18/predecessor-win-x64
      - name: Publish exact Phase 19 Web predecessor
        shell: pwsh
        run: ./tools/publish-phase19-predecessor.ps1 -Rid win-x64 -OutputDirectory .artifacts/phase20/predecessor-win-x64
      - name: Require clean-host, real SCM Server and Worker, upgrade and disaster recovery
        shell: pwsh
        env:
          HISPANIA_NATIVE_SCM_ENABLED: ${{ steps.windows-scm.outputs.enabled }}
        run: |
          New-Item -ItemType Directory -Path $env:HISPANIA_PHASE18_SERVICE_ROOT -Force | Out-Null
          $phase18Arguments = @{
            ArtifactDirectory = '.artifacts/phase18/win-x64'
            PredecessorDirectory = '.artifacts/phase18/predecessor-win-x64'
            WebPredecessorDirectory = '.artifacts/phase20/predecessor-win-x64'
            ResultsDirectory = '.artifacts/phase18/evidence'
          }
          if ($env:HISPANIA_NATIVE_SCM_ENABLED -eq 'true') { $phase18Arguments.RequireNativeService = $true }
          & ./tools/test-phase18-production-deployment.ps1 @phase18Arguments 2>&1 | Tee-Object -FilePath .artifacts/phase18/production-gate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan production artifacts and captured local outputs for secret canaries
        if: always()
        shell: pwsh
        run: ./tools/test-security-canaries.ps1 -EvidenceDirectory .artifacts/phase18 -ArtifactDirectory .artifacts/phase18/win-x64
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase18-windows-evidence
          path: |
            .artifacts/phase18/evidence
            .artifacts/phase18/*.build-evidence.json
            .artifacts/phase18/*.manifest.sha256
            .artifacts/phase18/win-x64/artifact-manifest.json
            .artifacts/phase18/*.npm-audit.json
            .artifacts/phase18/win-x64.zip*
      - name: Release protected SCM helper generation lock
        if: always()
        shell: pwsh
        run: |
          $lockPid = $env:HISPANIA_PHASE21_LOCKER_PID
          $readyFile = $env:HISPANIA_PHASE21_LOCKER_READY_FILE
          if (-not $lockPid -or -not $readyFile) { Write-Output 'No protected SCM generation lock was started.'; exit 0 }
          $lockScript = [IO.Path]::GetFullPath((Join-Path $PWD 'tools/ci/hold-windows-scm-generation.ps1'))
          $process = Get-CimInstance Win32_Process -Filter "ProcessId=$lockPid" -ErrorAction SilentlyContinue
          if ($process) {
            if ($process.Name -notmatch '^(?i:pwsh)\.exe$' -or -not $process.CommandLine.Contains($lockScript,[StringComparison]::OrdinalIgnoreCase) -or -not $process.CommandLine.Contains($readyFile,[StringComparison]::OrdinalIgnoreCase)) { throw 'Refusing to stop a process that is not this run''s exact lock holder.' }
            Stop-Process -Id ([int]$lockPid) -Force
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            while ((Get-Process -Id ([int]$lockPid) -ErrorAction SilentlyContinue) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 200 }
            if (Get-Process -Id ([int]$lockPid) -ErrorAction SilentlyContinue) { throw 'Protected SCM generation lock process did not exit.' }
          }
          if (Test-Path -LiteralPath $readyFile) {
            $record = Get-Content -LiteralPath $readyFile -Raw | ConvertFrom-Json
            if ($record.runId -cne $env:GITHUB_RUN_ID -or $record.runAttempt -cne $env:GITHUB_RUN_ATTEMPT -or [int]$record.processId -ne [int]$lockPid) { throw 'Refusing to remove a lock marker not owned by this workflow run.' }
            Remove-Item -LiteralPath $readyFile -Force
          }
          Write-Output 'Protected SCM helper generation lock released.'

  windows-scm-hosted-acceptance:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha && inputs.hosted_scm_acceptance == true
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      HISPANIA_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      HISPANIA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Verify GitHub-hosted Windows isolation and SCM privilege
        shell: pwsh
        env:
          HISPANIA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:HISPANIA_RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'This acceptance job must run on an ephemeral GitHub-hosted Windows x64 VM.' }
          if ($env:GITHUB_REPOSITORY -cne 'joaquimcastilla/hispania' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cne 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' -or $env:GITHUB_ACTOR -cne 'joaquimcastilla' -or $env:HISPANIA_TRIGGERING_ACTOR -cne 'joaquimcastilla' -or $env:HISPANIA_CANDIDATE_SHA -cne $env:GITHUB_SHA) { throw 'Hosted SCM acceptance is not authorized for this exact repository, actor, branch, and SHA.' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'GitHub-hosted runner token is not a member of Administrators; SCM gate stopped before creating a service.' }
          $integrity = @(whoami.exe /groups /fo csv | ConvertFrom-Csv | Where-Object { $_.SID -eq 'S-1-16-12288' -or $_.'Nombre conocido' -match 'High Mandatory|Nivel obligatorio alto' })
          if ($integrity.Count -eq 0) { throw 'GitHub-hosted runner process is not high-integrity/elevated; SCM gate stopped before creating a service.' }
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.Caption -notmatch 'Windows Server 2025') { throw "Expected Windows Server 2025, found $($os.Caption)." }
          $sdk = (& dotnet --list-sdks) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $sdk -notmatch '(?m)^10\.0\.') { throw '.NET 10 SDK is unavailable on the hosted runner.' }
          $existing = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -match '^Hispania-Test-[0-9a-f]{32}-(Server|Worker)$' })
          if ($existing.Count -gt 0) { throw 'Unexpected pre-existing Hispania test service found; refusing to use SCM.' }
          foreach ($productionName in @('HispaniaServer','HispaniaWorker')) {
            if (Get-Service -Name $productionName -ErrorAction SilentlyContinue) { throw "Unexpected pre-existing $productionName service found; refusing to use SCM." }
          }
          $baseRoot = [IO.Path]::GetFullPath((Join-Path $env:ProgramData 'HispaniaPhase18CI'))
          if ((Test-Path -LiteralPath $baseRoot) -and ((Get-Item -LiteralPath $baseRoot -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Hispania fixture base is a reparse point.' }
          $root = [IO.Path]::GetFullPath((Join-Path $baseRoot "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"))
          $programDataPrefix = [IO.Path]::GetFullPath($env:ProgramData).TrimEnd('\') + '\'
          if (-not $root.StartsWith($programDataPrefix,[StringComparison]::OrdinalIgnoreCase) -or (Test-Path -LiteralPath $root)) { throw 'Per-run fixture root is unsafe or already exists on this ephemeral VM.' }
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          if ((Get-Item -LiteralPath $root -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Fixture root is a reparse point.' }
          & icacls.exe $root /grant '*S-1-5-19:(OI)(CI)RX' /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant LocalService fixture-root traversal/read access.' }
          "HISPANIA_PHASE18_SERVICE_ROOT=$root" | Add-Content -LiteralPath $env:GITHUB_ENV
          "HISPANIA_RUNNER_ENVIRONMENT=$env:HISPANIA_RUNNER_ENVIRONMENT" | Add-Content -LiteralPath $env:GITHUB_ENV
          $helper = (Resolve-Path './tools/ci/windows-hosted-scm-helper.ps1').Path
          $hashText = (Get-Content -LiteralPath $helper -Raw).Replace("`r`n","`n")
          $helperHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.UTF8Encoding]::new($false).GetBytes($hashText))).ToLowerInvariant()
          $serviceText = (Get-Content -LiteralPath './deployment/windows-service.ps1' -Raw).Replace("`r`n","`n")
          $serviceHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.UTF8Encoding]::new($false).GetBytes($serviceText))).ToLowerInvariant()
          $brokerText = (Get-Content -LiteralPath './tools/ci/windows-native-service-helper.ps1' -Raw).Replace("`r`n","`n")
          $brokerHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.UTF8Encoding]::new($false).GetBytes($brokerText))).ToLowerInvariant()
          @(
            '### Hosted Windows SCM preflight',
            "- OS: $($os.Caption) ($($os.Version)); architecture: $env:RUNNER_ARCH",
            "- Runner environment: $env:HISPANIA_RUNNER_ENVIRONMENT; runner: $env:RUNNER_NAME",
            "- Identity SID: $($identity.User.Value); administrator membership: true; high-integrity token: true",
            "- .NET SDK: $($sdk -split "`n" | Where-Object { $_ -match '^10\.0\.' } | Select-Object -Last 1)",
            "- Candidate SHA: $env:GITHUB_SHA; hosted helper normalized SHA-256: $helperHash",
            "- Packaged SCM script normalized SHA-256: $serviceHash; protected broker candidate (not executed here) SHA-256: $brokerHash",
            "- Fixture root: $root; pre-existing Hispania services: none"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "HISPANIA_PHASE21_NATIVE_HELPER=$helper" | Add-Content -LiteralPath $env:GITHUB_ENV
          'HISPANIA_PHASE21_HOSTED_SCM=true' | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Install and verify pinned FFmpeg prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=9.0.2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg installation failed.' }
          foreach ($toolName in @('ffmpeg.exe','ffprobe.exe')) {
            $tool = Get-Command $toolName -ErrorAction Stop
            $versionOutput = & $tool.Source -version 2>&1 | Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace([string]$versionOutput)) { throw "$toolName did not execute successfully." }
            "- $toolName`: $versionOutput ($($tool.Source))" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - name: Build and publish exact win-x64 fixture artifact
        shell: pwsh
        run: |
          npm ci --prefix apps/web
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          ./tools/publish-production.ps1 -Rid win-x64 -OutputDirectory .artifacts/phase18/win-x64
      - name: Execute real Windows SCM server and worker acceptance, including recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HISPANIA_PHASE18_ARTIFACT = (Resolve-Path '.artifacts/phase18/win-x64').Path
          $env:HISPANIA_PHASE18_REQUIRE_SERVICE = '1'
          New-Item -ItemType Directory -Path '.artifacts/phase18/evidence' -Force | Out-Null
          dotnet test tests/deployment-process/Hispania.Deployment.ProcessTests.csproj --configuration Release --filter 'Category=Phase18NativeService' --results-directory .artifacts/phase18/evidence --logger 'trx;LogFileName=windows-scm-native.trx' --nologo -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows SCM native service tests failed.' }
          $trx = [xml](Get-Content -LiteralPath '.artifacts/phase18/evidence/windows-scm-native.trx' -Raw)
          $results = @($trx.TestRun.Results.UnitTestResult)
          if ($results.Count -ne 2 -or @($results | Where-Object outcome -ne 'Passed').Count -ne 0) { throw 'SCM acceptance requires exactly two passed cases, with no skips or failures.' }
          'SCM acceptance result: both Server and Worker passed with real SCM, including controlled recovery.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Verify owned SCM cleanup and remove temporary fixture root
        if: always()
        shell: pwsh
        run: |
          $baseRoot = [IO.Path]::GetFullPath((Join-Path $env:ProgramData 'HispaniaPhase18CI'))
          if ((Test-Path -LiteralPath $baseRoot) -and ((Get-Item -LiteralPath $baseRoot -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Refusing cleanup through a reparse-point fixture base.' }
          $root = [IO.Path]::GetFullPath((Join-Path $baseRoot "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"))
          $programDataPrefix = [IO.Path]::GetFullPath($env:ProgramData).TrimEnd('\') + '\'
          if (-not $root.StartsWith($programDataPrefix,[StringComparison]::OrdinalIgnoreCase)) { throw 'Refusing cleanup outside this GitHub-hosted VM fixture root.' }
          if (Test-Path -LiteralPath $root) {
            if ((Get-Item -LiteralPath $root -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Refusing cleanup through a reparse-point fixture root.' }
            foreach ($service in @(Get-CimInstance Win32_Service | Where-Object { $_.Name -match '^Hispania-Test-[0-9a-f]{32}-(Server|Worker)$' })) {
              $role = if ($service.Name.EndsWith('-Server')) { 'server' } else { 'worker' }
              $id = [regex]::Match($service.Name,'^Hispania-Test-([0-9a-f]{32})-(Server|Worker)$').Groups[1].Value
              $leaf = 'hispania-phase18 isolated ñ ' + $id
              $fixtureHome = Join-Path $root $leaf
              $assembly = if ($role -eq 'server') { 'Hispania.Server' } else { 'Hispania.WorkerAgent' }
              $directory = if ($role -eq 'server') { 'server' } else { 'worker' }
              $expected = '"' + [IO.Path]::GetFullPath((Join-Path $fixtureHome "app/$directory/$assembly.exe")) + '" --home "' + $fixtureHome + '"'
              if ($service.PathName -cne $expected -or $service.StartName -cne 'NT AUTHORITY\LocalService' -or [IO.Path]::GetDirectoryName([IO.Path]::GetFullPath($fixtureHome)) -ine $root) { throw "Refusing to clean service not proven owned by the current fixture: $($service.Name)" }
              & ./deployment/windows-service.ps1 -Action uninstall -InstallationHome $fixtureHome -Role $role -ServiceName $service.Name
            }
            $remaining = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -match '^Hispania-Test-[0-9a-f]{32}-(Server|Worker)$' })
            if ($remaining.Count -gt 0) { throw 'Hispania fixture service remains after cleanup.' }
            if (@(Get-ChildItem -LiteralPath $root -Force -Recurse | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count -gt 0) { throw 'Refusing recursive cleanup because the fixture contains a reparse point.' }
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          'Verified no fixture services remain; removed the job-scoped temporary root.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Preserve hosted Windows SCM evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase21-hosted-windows-scm-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .artifacts/phase18/evidence
            .artifacts/phase18/win-x64/artifact-manifest.json
            .artifacts/phase18/win-x64.build-evidence.json
            .artifacts/phase18/win-x64.manifest.sha256
            .artifacts/phase18/production-gate.log
