name: ARM64 Platform integration (Pi 4B)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full SHA for the exact candidate branch commit.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: hispania-arm64-platform-integration
  cancel-in-progress: false

jobs:
  hispania-arm64-integration:
    if: github.actor == 'joaquimcastilla' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hispania-arm64-integration
    timeout-minutes: 20
    steps:
      - name: Verify runner identity and fixed inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "$(id -un)" = hispania-integration-runner
          test "$(uname -m)" = aarch64
          dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App 10\.'
          test -r /opt/hispania-ci-integration/artifacts/hispania-platform-pi4-arm64-working-tree-20261011.tar.gz
          test "$(sha256sum /opt/hispania-ci-integration/artifacts/hispania-platform-pi4-arm64-working-tree-20261011.tar.gz | cut -d' ' -f1)" = b484edf386c203539708004cba8ad424db7dd52aee8da29bbbe70817c3f077b4
          test -r /opt/hispania-ci-integration/scripts/arm64-platform-integration.sh
          test "$(sha256sum /opt/hispania-ci-integration/scripts/arm64-platform-integration.sh | cut -d' ' -f1)" = 18c2e24e6c0a8ef50b55e541f527c117e2ad13b90b138b2887795918628f8abf

      - name: Run isolated ARM64 Platform integration smoke
        shell: bash
        run: bash /opt/hispania-ci-integration/scripts/arm64-platform-integration.sh

  candidate-arm64-integration:
    if: github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hispania-arm64-integration
    timeout-minutes: 25
    steps:
      - name: Verify dispatch identity and runner
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euxo pipefail
          test "$GITHUB_REPOSITORY" = joaquimcastilla/hispania
          test "$GITHUB_ACTOR" = joaquimcastilla
          test "$TRIGGERING_ACTOR" = joaquimcastilla
          test "$GITHUB_REF" = refs/heads/codex/hispania-0.7.0-step2-1-production-readiness
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$(id -un)" = hispania-integration-runner
          test "$(uname -m)" = aarch64
          dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App 10\.'
          command -v tar >/dev/null
          command -v sha256sum >/dev/null

      - name: Prepare pinned PowerShell in runner temporary storage when absent
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null; then
            pwsh --version
            exit 0
          fi
          readonly version=7.6.6
          readonly expected_sha256=924829e54c983648f6f1419a2dc7f9433c861b2fb5bd57736ff096c24f133729
          readonly directory="$RUNNER_TEMP/hispania-pwsh-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          readonly archive="$RUNNER_TEMP/hispania-pwsh-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          test "$(realpath -e "$RUNNER_TEMP")" = "$RUNNER_TEMP"
          test ! -e "$directory" && test ! -e "$archive"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/PowerShell/PowerShell/releases/download/v$version/powershell-$version-linux-arm64.tar.gz"
          echo "$expected_sha256  $archive" | sha256sum --check --status
          mkdir -m 700 -- "$directory"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$directory"
          chmod 700 "$directory/pwsh"
          "$directory/pwsh" --version
          printf '%s\n' "$directory" >> "$GITHUB_PATH"
          rm -f -- "$archive"

      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact candidate commit timestamp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          epoch="$(curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REQUESTED_SHA" \
            | python3 -c 'import datetime,json,sys; value=json.load(sys.stdin)["commit"]["committer"]["date"]; print(int(datetime.datetime.fromisoformat(value.replace("Z","+00:00")).timestamp()))')"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'HISPANIA_SOURCE_COMMIT_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Prepare pinned .NET SDK in runner temporary storage
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/hispania-dotnet

      - name: Build and verify candidate artifact on Pi 4B
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$REQUESTED_SHA"
          test "$GITHUB_REF_NAME" = codex/hispania-0.7.0-step2-1-production-readiness
          output="$RUNNER_TEMP/hispania-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive="$RUNNER_TEMP/hispania-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          printf 'HISPANIA_ARM64_OUTPUT_DIR=%s\n' "$output" >> "$GITHUB_ENV"
          printf 'HISPANIA_ARM64_ARTIFACT_PATH=%s\n' "$archive" >> "$GITHUB_ENV"
          pwsh -NoLogo -NoProfile -File tools/publish-platform-only.ps1 -Rid linux-arm64 -OutputDirectory "$output"
          python3 - "$output/artifact-manifest.json" "$REQUESTED_SHA" <<'PY'
          import json, pathlib, sys
          manifest=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8-sig'))
          assert manifest.get('gitSha') == sys.argv[2]
          assert manifest.get('sourceDirty') is False
          assert manifest.get('sourceBranch') == 'codex/hispania-0.7.0-step2-1-production-readiness'
          assert manifest.get('targetRid') == 'linux-arm64' and manifest.get('architecture') == 'aarch64'
          PY
          tar -czf "$archive" -C "$output" .
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf 'HISPANIA_ARM64_ARTIFACT_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'HISPANIA_ARM64_ARTIFACT_GIT_SHA=%s\n' "$REQUESTED_SHA" >> "$GITHUB_ENV"
          printf 'Candidate commit: %s\nArtifact SHA-256: %s\n' "$REQUESTED_SHA" "$digest"

      - name: Run isolated candidate integration smoke
        shell: bash
        run: bash .github/scripts/arm64-platform-integration.sh

      - name: Remove candidate build outputs from runner temp
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HISPANIA_ARM64_ARTIFACT_PATH:-}" && -n "${HISPANIA_ARM64_OUTPUT_DIR:-}" ]] || exit 0
          archive="$RUNNER_TEMP/hispania-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          output="$RUNNER_TEMP/hispania-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$HISPANIA_ARM64_ARTIFACT_PATH" == "$archive" ]]
          [[ "$HISPANIA_ARM64_OUTPUT_DIR" == "$output" ]]
          [[ "$(realpath -e "$(dirname "$archive")")" == "$(realpath -e "$RUNNER_TEMP")" ]]
          [[ "$(realpath -e "$(dirname "$output")")" == "$(realpath -e "$RUNNER_TEMP")" ]]
          [[ "$(basename "$output")" =~ ^hispania-arm64-[0-9]+-[0-9]+$ ]]
          rm -f -- "$archive"
          rm -rf -- "$output"
          for suffix in .manifest.sha256 .build-evidence.json .zip .zip.sha256; do
            sidecar="$output$suffix"
            [[ "$(dirname "$sidecar")" == "$RUNNER_TEMP" ]]
            [[ "$(basename "$sidecar")" == "$(basename "$output")$suffix" ]]
            rm -f -- "$sidecar"
          done
