name: ARM64 Platform integration (Pi 4B)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full SHA for the exact candidate branch commit.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: hispania-arm64-platform-integration
  cancel-in-progress: false

jobs:
  build-candidate-arm64:
    if: github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Resolve exact commit timestamp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          epoch="$(curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REQUESTED_SHA" \
            | python3 -c 'import datetime,json,sys; value=json.load(sys.stdin)["commit"]["committer"]["date"]; print(int(datetime.datetime.fromisoformat(value.replace("Z","+00:00")).timestamp()))')"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'HISPANIA_SOURCE_COMMIT_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Build and verify Platform-only linux-arm64 artifact on x64
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ($env:GITHUB_SHA -cne $env:REQUESTED_SHA -or $env:GITHUB_REF_NAME -cne 'codex/hispania-0.7.0-step2-1-production-readiness') { throw 'Unexpected candidate identity.' }
          ./tools/publish-platform-only.ps1 -Rid linux-arm64 -OutputDirectory '.artifacts/arm64-candidate/package'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate manifest, exclusions and make commit-bound archive
        id: package
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 - .artifacts/arm64-candidate/package/artifact-manifest.json .artifacts/arm64-candidate/package "$REQUESTED_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          manifest_path, root, sha = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          manifest=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          assert manifest.get('gitSha') == sha and manifest.get('sourceDirty') is False
          assert manifest.get('sourceBranch') == 'codex/hispania-0.7.0-step2-1-production-readiness'
          assert manifest.get('targetRid') == 'linux-arm64' and manifest.get('architecture') == 'aarch64'
          files=manifest.get('files'); assert isinstance(files, dict) and files
          expected=set()
          for relative, digest in files.items():
              path=pathlib.PurePosixPath(relative)
              assert not path.is_absolute() and '..' not in path.parts
              actual=root.joinpath(*path.parts)
              assert actual.is_file() and hashlib.sha256(actual.read_bytes()).hexdigest() == digest.lower(), relative
              expected.add(actual.resolve())
          actual={p.resolve() for p in root.rglob('*') if p.is_file() and p != manifest_path}
          assert actual == expected, 'unmanifested or missing package files'
          forbidden=('WindowsServices', 'Hispania.Media', 'Hispania.Inventory', 'FFmpeg')
          names=[p.name for p in root.rglob('*') if p.is_file()]
          assert not any(term.casefold() in name.casefold() for term in forbidden for name in names)
          deps=(root/'server/Hispania.Platform.Server.deps.json').read_text(encoding='utf-8')
          assert not any(term.casefold() in deps.casefold() for term in forbidden)
          PY
          mkdir -p .artifacts/arm64-candidate/upload
          tar -czf .artifacts/arm64-candidate/upload/candidate.tar.gz -C .artifacts/arm64-candidate/package .
          artifact_sha="$(sha256sum .artifacts/arm64-candidate/upload/candidate.tar.gz | cut -d' ' -f1)"
          manifest_sha="$(sha256sum .artifacts/arm64-candidate/package/artifact-manifest.json | cut -d' ' -f1)"
          artifact_name="hispania-platform-linux-arm64-$REQUESTED_SHA"
          printf '{"runId":"%s","runAttempt":"%s","sourceSha":"%s","sourceBranch":"%s","targetRid":"linux-arm64","architecture":"aarch64","artifactSha256":"%s","manifestSha256":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$REQUESTED_SHA" "$GITHUB_REF_NAME" "$artifact_sha" "$manifest_sha" \
            > .artifacts/arm64-candidate/upload/attestation.json
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\nartifact_sha256=%s\nmanifest_sha256=%s\n' "$REQUESTED_SHA" "$artifact_sha" "$manifest_sha"

      - name: Upload exact ARM64 artifact for native jobs in this run
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: .artifacts/arm64-candidate/upload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  hispania-arm64-integration:
    if: github.actor == 'joaquimcastilla' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hispania-arm64-integration
    timeout-minutes: 20
    steps:
      - name: Verify runner identity and fixed inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "$(id -un)" = hispania-integration-runner
          test "$(uname -m)" = aarch64
          dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App 10\.'
          test -r /opt/hispania-ci-integration/artifacts/hispania-platform-pi4-arm64-working-tree-20261011.tar.gz
          test "$(sha256sum /opt/hispania-ci-integration/artifacts/hispania-platform-pi4-arm64-working-tree-20261011.tar.gz | cut -d' ' -f1)" = b484edf386c203539708004cba8ad424db7dd52aee8da29bbbe70817c3f077b4
          test -r /opt/hispania-ci-integration/scripts/arm64-platform-integration.sh
          test "$(sha256sum /opt/hispania-ci-integration/scripts/arm64-platform-integration.sh | cut -d' ' -f1)" = 18c2e24e6c0a8ef50b55e541f527c117e2ad13b90b138b2887795918628f8abf

      - name: Run isolated ARM64 Platform integration smoke
        shell: bash
        run: bash /opt/hispania-ci-integration/scripts/arm64-platform-integration.sh

  candidate-arm64-integration:
    if: github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha
    needs: build-candidate-arm64
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hispania-arm64-integration
    timeout-minutes: 25
    steps:
      - name: Verify dispatch identity and runner
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euxo pipefail
          test "$GITHUB_REPOSITORY" = joaquimcastilla/hispania
          test "$GITHUB_ACTOR" = joaquimcastilla
          test "$TRIGGERING_ACTOR" = joaquimcastilla
          test "$GITHUB_REF" = refs/heads/codex/hispania-0.7.0-step2-1-production-readiness
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$(id -un)" = hispania-integration-runner
          test "$(uname -m)" = aarch64
          dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App 10\.'
          command -v tar >/dev/null
          command -v sha256sum >/dev/null

      - name: Prepare pinned PowerShell in runner temporary storage when absent
        shell: bash
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null; then
            pwsh --version
            exit 0
          fi
          readonly version=7.6.6
          readonly expected_sha256=924829e54c983648f6f1419a2dc7f9433c861b2fb5bd57736ff096c24f133729
          readonly directory="$RUNNER_TEMP/hispania-pwsh-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          readonly archive="$RUNNER_TEMP/hispania-pwsh-$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          test "$(realpath -e "$RUNNER_TEMP")" = "$RUNNER_TEMP"
          test ! -e "$directory" && test ! -e "$archive"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/PowerShell/PowerShell/releases/download/v$version/powershell-$version-linux-arm64.tar.gz"
          echo "$expected_sha256  $archive" | sha256sum --check --status
          mkdir -m 700 -- "$directory"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$directory"
          chmod 700 "$directory/pwsh"
          "$directory/pwsh" --version
          printf '%s\n' "$directory" >> "$GITHUB_PATH"
          rm -f -- "$archive"

      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact candidate commit timestamp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          epoch="$(curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$REQUESTED_SHA" \
            | python3 -c 'import datetime,json,sys; value=json.load(sys.stdin)["commit"]["committer"]["date"]; print(int(datetime.datetime.fromisoformat(value.replace("Z","+00:00")).timestamp()))')"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          printf 'HISPANIA_SOURCE_COMMIT_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"

      - name: Download exact artifact built in this workflow run
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-candidate-arm64.outputs.artifact_name }}
          path: ${{ runner.temp }}/hispania-arm64-artifact-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify artifact provenance and checksum on Pi 4B
        id: artifact
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-candidate-arm64.outputs.artifact_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-candidate-arm64.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$REQUESTED_SHA"
          test "$GITHUB_REF_NAME" = codex/hispania-0.7.0-step2-1-production-readiness
          artifact_dir="$RUNNER_TEMP/hispania-arm64-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive="$artifact_dir/candidate.tar.gz"
          test "$(realpath -e "$artifact_dir")" = "$artifact_dir"
          python3 - "$artifact_dir/attestation.json" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$REQUESTED_SHA" "$EXPECTED_ARTIFACT_SHA256" "$EXPECTED_MANIFEST_SHA256" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['runId']==sys.argv[2] and data['runAttempt']==sys.argv[3]
          assert data['sourceSha']==sys.argv[4]
          assert data['sourceBranch']=='codex/hispania-0.7.0-step2-1-production-readiness'
          assert data['targetRid']=='linux-arm64' and data['architecture']=='aarch64'
          assert data['artifactSha256']==sys.argv[5] and data['manifestSha256']==sys.argv[6]
          PY
          echo "$EXPECTED_ARTIFACT_SHA256  $archive" | sha256sum --check --status
          printf 'HISPANIA_ARM64_ARTIFACT_PATH=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'HISPANIA_ARM64_ARTIFACT_SHA256=%s\n' "$EXPECTED_ARTIFACT_SHA256" >> "$GITHUB_ENV"
          printf 'HISPANIA_ARM64_ARTIFACT_GIT_SHA=%s\n' "$REQUESTED_SHA" >> "$GITHUB_ENV"
          printf 'HISPANIA_ARM64_ARTIFACT_MANIFEST_SHA256=%s\n' "$EXPECTED_MANIFEST_SHA256" >> "$GITHUB_ENV"
          printf 'Candidate commit: %s\nArtifact SHA-256: %s\nManifest SHA-256: %s\n' "$REQUESTED_SHA" "$EXPECTED_ARTIFACT_SHA256" "$EXPECTED_MANIFEST_SHA256"

      - name: Run isolated candidate integration smoke
        shell: bash
        run: bash .github/scripts/arm64-platform-integration.sh

      - name: Remove candidate build outputs from runner temp
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/hispania-arm64-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$(realpath -e "$artifact_dir")" == "$artifact_dir" ]]
          [[ "$(basename "$artifact_dir")" =~ ^hispania-arm64-artifact-[0-9]+-[0-9]+$ ]]
          rm -rf -- "$artifact_dir"

  candidate-arm64-smoke-pi3:
    if: github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha
    needs: build-candidate-arm64
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hispania-arm64
    timeout-minutes: 12
    steps:
      - name: Verify Pi 3B+ identity and runtime
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = joaquimcastilla/hispania
          test "$GITHUB_ACTOR" = joaquimcastilla
          test "$TRIGGERING_ACTOR" = joaquimcastilla
          test "$GITHUB_REF" = refs/heads/codex/hispania-0.7.0-step2-1-production-readiness
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App 10\.'

      - name: Checkout exact candidate scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact artifact built in this workflow run
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-candidate-arm64.outputs.artifact_name }}
          path: ${{ runner.temp }}/hispania-arm64-artifact-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify provenance and checksum then run light native smoke
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-candidate-arm64.outputs.artifact_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-candidate-arm64.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/hispania-arm64-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          archive="$artifact_dir/candidate.tar.gz"
          python3 - "$artifact_dir/attestation.json" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$REQUESTED_SHA" "$EXPECTED_ARTIFACT_SHA256" "$EXPECTED_MANIFEST_SHA256" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['runId']==sys.argv[2] and data['runAttempt']==sys.argv[3]
          assert data['sourceSha']==sys.argv[4] and data['sourceBranch']=='codex/hispania-0.7.0-step2-1-production-readiness'
          assert data['targetRid']=='linux-arm64' and data['architecture']=='aarch64'
          assert data['artifactSha256']==sys.argv[5] and data['manifestSha256']==sys.argv[6]
          PY
          echo "$EXPECTED_ARTIFACT_SHA256  $archive" | sha256sum --check --status
          printf 'HISPANIA_ARM64_ARTIFACT_PATH=%s\nHISPANIA_ARM64_ARTIFACT_SHA256=%s\nHISPANIA_ARM64_ARTIFACT_GIT_SHA=%s\nHISPANIA_ARM64_ARTIFACT_MANIFEST_SHA256=%s\n' \
            "$archive" "$EXPECTED_ARTIFACT_SHA256" "$REQUESTED_SHA" "$EXPECTED_MANIFEST_SHA256" >> "$GITHUB_ENV"
          export HISPANIA_ARM64_ARTIFACT_PATH="$archive"
          export HISPANIA_ARM64_ARTIFACT_SHA256="$EXPECTED_ARTIFACT_SHA256"
          export HISPANIA_ARM64_ARTIFACT_GIT_SHA="$REQUESTED_SHA"
          export HISPANIA_ARM64_ARTIFACT_MANIFEST_SHA256="$EXPECTED_MANIFEST_SHA256"
          bash .github/scripts/arm64-platform-smoke-candidate.sh

      - name: Record Pi 3B+ resources and throttling
        if: always()
        shell: bash
        run: |
          set -u
          printf 'runner=%s\narchitecture=%s\n' "$RUNNER_NAME" "$(uname -m)"
          printf 'memory_available='; awk '/MemAvailable:/ {print $2 " KiB"}' /proc/meminfo
          printf 'temperature_millidegrees='; cat /sys/class/thermal/thermal_zone0/temp 2>&1 || true
          printf 'arm_scaling_frequency_khz='; cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>&1 || true
          if command -v vcgencmd >/dev/null 2>&1; then
            raw="$(vcgencmd get_throttled 2>&1 || true)"; printf 'throttling_raw=%s\n' "$raw"
            python3 - "$raw" <<'PY'
          import re, sys
          match=re.search(r'0x([0-9a-fA-F]+)',sys.argv[1])
          if not match: print('throttling_decode=unavailable')
          else:
              bits=int(match.group(1),16)
              for index,name in enumerate(('under_voltage','arm_frequency_capped','throttled','soft_temperature_limit')):
                  print(f'{name}_active={bool(bits & (1<<index))}')
                  print(f'{name}_historic={bool(bits & (1<<(index+16)))}')
          PY
          else
            printf 'throttling=unavailable (vcgencmd missing)\n'
          fi
          artifact_dir="$RUNNER_TEMP/hispania-arm64-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -d "$artifact_dir" && ! -L "$artifact_dir" && "$(realpath -e "$artifact_dir")" == "$artifact_dir" ]]; then rm -rf -- "$artifact_dir"; fi
