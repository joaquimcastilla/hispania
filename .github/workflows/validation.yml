name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hispania
          POSTGRES_DB: hispania_tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hispania -d hispania_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HISPANIA_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=hispania_tests;Username=hispania;Timeout=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install FFmpeg integration tools
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: dotnet restore Hispania.CrossPlatform.slnf
      - name: Require PostgreSQL integration configuration
        run: test -n "$HISPANIA_POSTGRES_TEST_CONNECTION"
      - run: dotnet build Hispania.CrossPlatform.slnf --no-restore
      - name: Require Platform-only dependency boundary
        run: dotnet build Hispania.Platform.slnf
      - name: Require Inventory, persistence, API restart, and architecture coverage
        run: dotnet test tests/inventory/Hispania.Inventory.Tests.csproj
      - name: Build and package the greeting extension independently
        shell: pwsh
        run: |
          dotnet publish modules/extension-demo/Hispania.ExtensionDemo.csproj --configuration Release --output .artifacts/phase7/greeting-v1
          ./tools/package-extension.ps1 -PublishDirectory .artifacts/phase7/greeting-v1 -ManifestTemplate extensions/experimental-greeting/manifest.template.json -OutputPath .artifacts/phase7/greeting-1.0.0.hispania
          dotnet publish modules/extension-demo/Hispania.ExtensionDemo.csproj --configuration Release --output .artifacts/phase7/greeting-v2
          ./tools/package-extension.ps1 -PublishDirectory .artifacts/phase7/greeting-v2 -ManifestTemplate extensions/experimental-greeting/manifest-v2.template.json -OutputPath .artifacts/phase7/greeting-2.0.0.hispania
      - name: Build and sign an out-of-process greeting package
        shell: pwsh
        run: |
          dotnet publish modules/extension-demo/Hispania.ExtensionDemo.csproj --configuration Release --output .artifacts/phase8/greeting-oop
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $keyPath = Join-Path $env:RUNNER_TEMP 'hispania-ci-publisher.pem'
          [System.IO.File]::WriteAllText($keyPath, $rsa.ExportPkcs8PrivateKeyPem())
          try {
            ./tools/package-extension.ps1 -PublishDirectory .artifacts/phase8/greeting-oop -ManifestTemplate extensions/experimental-greeting/manifest-outofprocess.template.json -OutputPath .artifacts/phase8/greeting-3.0.0.hispania -PublisherId 'hispania.ci.ephemeral' -SigningKeyPath $keyPath
          } finally {
            $rsa.Dispose()
            Remove-Item -LiteralPath $keyPath -Force
          }
      - name: Require live PostgreSQL migration and constraint integration
        shell: pwsh
        run: |
          dotnet test tests/library-persistence/Hispania.Library.Persistence.Sqlite.Tests.csproj --no-build --filter FullyQualifiedName~PostgreSqlMigrationAndConnectionFailureRecoveryUseAnIsolatedSchema --logger "trx;LogFileName=required-postgres.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/library-persistence/TestResults/required-postgres.trx -ErrorAction Stop).FullName)
          $passed = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.testName -like '*PostgreSqlMigrationAndConnectionFailureRecoveryUseAnIsolatedSchema*' -and $_.outcome -eq 'Passed' })
          if ($passed.Count -eq 0) { throw 'The required PostgreSQL integration test did not pass or was not discovered.' }
      - name: Require Linux FFmpeg worker process recovery and real media integration
        shell: pwsh
        run: |
          dotnet test tests/playback/Hispania.Playback.Tests.csproj --no-build --filter "FullyQualifiedName~FfmpegWorkerRecoveryTests|FullyQualifiedName~MkvFallbackIntegrationTests" --logger "trx;LogFileName=required-linux-media.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/playback/TestResults/required-linux-media.trx -ErrorAction Stop).FullName)
          $results = @($trx.TestRun.Results.UnitTestResult)
          if (@($results | Where-Object { $_.testName -like '*FfmpegWorkerRecoveryTests*' -and $_.outcome -eq 'Passed' }).Count -eq 0) { throw 'The required FFmpeg recovery test did not pass or was not discovered.' }
          if (@($results | Where-Object { $_.testName -like '*MkvFallbackIntegrationTests*' -and $_.outcome -eq 'Passed' }).Count -eq 0) { throw 'The required real-media integration test did not pass or was not discovered.' }
      - name: Require Playback Planner experiment lifecycle and restart recovery
        shell: pwsh
        run: |
          dotnet test tests/playback/Hispania.Playback.Tests.csproj --no-build --filter "FullyQualifiedName~Persistent|FullyQualifiedName~RealPlannerModulesReceiveConfiguredTrafficAndStableCohortsSurviveWeightUpdates|FullyQualifiedName~InternalAdminModuleApiRequiresConfiguredBearerAuthentication|FullyQualifiedName~ConfigurationChangeKeepsAnActivePlanOnItsOriginalVariant" --logger "trx;LogFileName=required-playback-experiments.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/playback/TestResults/required-playback-experiments.trx -ErrorAction Stop).FullName)
          $results = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Passed' })
          foreach ($pattern in @('*AdminConfiguredPersistentExperimentRecoversWhenTestServerHostRestarts*', '*PersistentExperimentRestoresStableAssignmentsAndRealPlannerTrafficAfterRestart*', '*PersistentRecoveryFallsBackForMissingVariantsButRejectsChangedContracts*', '*RealPlannerModulesReceiveConfiguredTrafficAndStableCohortsSurviveWeightUpdates*', '*InternalAdminModuleApiRequiresConfiguredBearerAuthentication*', '*ConfigurationChangeKeepsAnActivePlanOnItsOriginalVariant*')) {
            if (@($results | Where-Object { $_.testName -like $pattern }).Count -eq 0) { throw "Required Playback Planner experiment test '$pattern' did not pass or was not discovered." }
          }
      - name: Require distributed worker process transport and coordinator restart fencing
        shell: pwsh
        run: |
          dotnet test tests/playback/Hispania.Playback.Tests.csproj --no-build --filter "FullyQualifiedName~DistributedWorkerProcessIntegrationTests|FullyQualifiedName~DistributedCoordinatorPersistenceTests|FullyQualifiedName~DistributedMediaTransferTests" --logger "trx;LogFileName=required-distributed-workers.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/playback/TestResults/required-distributed-workers.trx -ErrorAction Stop).FullName)
          $results = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Passed' })
          foreach ($pattern in @('*DistributedWorkerProcessIntegrationTests*', '*DistributedCoordinatorPersistenceTests*', '*DistributedMediaTransferTests*')) {
            if (@($results | Where-Object { $_.testName -like $pattern }).Count -eq 0) { throw "Required distributed worker test '$pattern' did not pass or was not discovered." }
          }
      - run: dotnet test Hispania.CrossPlatform.slnf --no-build

  validate-windows-launcher:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install FFmpeg integration tools
        run: choco install ffmpeg --yes --no-progress
      - run: dotnet restore Hispania.CrossPlatform.slnf
      - run: dotnet build Hispania.CrossPlatform.slnf --no-restore
      - name: Build the complete solution on Windows
        run: dotnet build Hispania.sln
      - name: Require Platform-only dependency boundary
        run: dotnet build Hispania.Platform.slnf
      - name: Require Inventory, persistence, API restart, and architecture coverage
        run: dotnet test tests/inventory/Hispania.Inventory.Tests.csproj
      - name: Require Windows FFmpeg worker process and media integration
        shell: pwsh
        run: |
          dotnet test tests/playback/Hispania.Playback.Tests.csproj --no-restore --filter "FullyQualifiedName~FfmpegWorkerRecoveryTests|FullyQualifiedName~MkvFallbackIntegrationTests" --logger "trx;LogFileName=required-windows-media.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/playback/TestResults/required-windows-media.trx -ErrorAction Stop).FullName)
          $results = @($trx.TestRun.Results.UnitTestResult)
          if (@($results | Where-Object { $_.testName -like '*FfmpegWorkerRecoveryTests*' -and $_.outcome -eq 'Passed' }).Count -eq 0) { throw 'The required FFmpeg recovery test did not pass or was not discovered.' }
          if (@($results | Where-Object { $_.testName -like '*MkvFallbackIntegrationTests*' -and $_.outcome -eq 'Passed' }).Count -eq 0) { throw 'The required real-media integration test did not pass or was not discovered.' }
      - name: Require Windows module Job Object attachment and recovery
        env:
          HISPANIA_TEST_WINDOWS_JOB_OBJECT: "1"
        shell: pwsh
        run: |
          dotnet test tests/unit/Hispania.Runtime.Tests.csproj --no-restore --filter FullyQualifiedName~OutOfProcessGreetingRunsThroughPublicContractAndRecoversAfterWorkerCrash --logger "trx;LogFileName=required-windows-job-object.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/unit/TestResults/required-windows-job-object.trx -ErrorAction Stop).FullName)
          $passed = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.testName -like '*OutOfProcessGreetingRunsThroughPublicContractAndRecoversAfterWorkerCrash*' -and $_.outcome -eq 'Passed' })
          if ($passed.Count -eq 0) { throw 'The required Windows Job Object test did not pass or was not discovered.' }
      - name: Require Windows Playback Planner experiment lifecycle and restart recovery
        shell: pwsh
        run: |
          dotnet test tests/playback/Hispania.Playback.Tests.csproj --no-build --filter "FullyQualifiedName~Persistent|FullyQualifiedName~RealPlannerModulesReceiveConfiguredTrafficAndStableCohortsSurviveWeightUpdates|FullyQualifiedName~InternalAdminModuleApiRequiresConfiguredBearerAuthentication|FullyQualifiedName~ConfigurationChangeKeepsAnActivePlanOnItsOriginalVariant" --logger "trx;LogFileName=required-windows-playback-experiments.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/playback/TestResults/required-windows-playback-experiments.trx -ErrorAction Stop).FullName)
          $results = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Passed' })
          foreach ($pattern in @('*AdminConfiguredPersistentExperimentRecoversWhenTestServerHostRestarts*', '*PersistentExperimentRestoresStableAssignmentsAndRealPlannerTrafficAfterRestart*', '*PersistentRecoveryFallsBackForMissingVariantsButRejectsChangedContracts*', '*RealPlannerModulesReceiveConfiguredTrafficAndStableCohortsSurviveWeightUpdates*', '*InternalAdminModuleApiRequiresConfiguredBearerAuthentication*', '*ConfigurationChangeKeepsAnActivePlanOnItsOriginalVariant*')) {
            if (@($results | Where-Object { $_.testName -like $pattern }).Count -eq 0) { throw "Required Playback Planner experiment test '$pattern' did not pass or was not discovered." }
          }
      - name: Require Windows distributed worker process transport and coordinator restart fencing
        shell: pwsh
        run: |
          dotnet test tests/playback/Hispania.Playback.Tests.csproj --no-build --filter "FullyQualifiedName~DistributedWorkerProcessIntegrationTests|FullyQualifiedName~DistributedCoordinatorPersistenceTests|FullyQualifiedName~DistributedMediaTransferTests" --logger "trx;LogFileName=required-windows-distributed-workers.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw (Get-ChildItem tests/playback/TestResults/required-windows-distributed-workers.trx -ErrorAction Stop).FullName)
          $results = @($trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Passed' })
          foreach ($pattern in @('*DistributedWorkerProcessIntegrationTests*', '*DistributedCoordinatorPersistenceTests*', '*DistributedMediaTransferTests*')) {
            if (@($results | Where-Object { $_.testName -like $pattern }).Count -eq 0) { throw "Required distributed worker test '$pattern' did not pass or was not discovered." }
          }
      - name: Run the complete .NET suite on Windows
        run: dotnet test Hispania.sln --no-build
