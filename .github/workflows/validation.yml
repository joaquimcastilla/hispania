          if (($first -join "`n") -cne ($second -join "`n")) { throw 'Corpus analysis must repeat identically.' }
          $manifest = ($first -join "`n") | ConvertFrom-Json
          if ($manifest.fixtures -ne 27 -or $manifest.manifestSha256 -ne '4cb34019df3824596917297e2c81a992f881f45bb2cc3a534752b6b970446da5') { throw 'Phase 15 manifest identity changed.' }
          $first
          python tools/test-compatibility-manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require Phase 15 immutable historical compatibility baselines
        shell: pwsh
        run: ./tools/test-phase15-compatibility.ps1 -ResultsDirectory .artifacts/phase15-ci
      - name: Require Phase 16 historical populated data upgrades
        shell: pwsh
        run: ./tools/test-phase16-historical-upgrades.ps1 -ResultsDirectory .artifacts/phase16-ci
      - name: Require Platform-only dependency boundary
        run: dotnet build Hispania.Platform.slnf
      - name: Require Inventory, persistence, API restart, and architecture coverage
        run: dotnet test tests/inventory/Hispania.Inventory.Tests.csproj
      - name: Require Phase 13 closure, real crash recovery, safe errors and 20 concurrency repetitions
        shell: pwsh
