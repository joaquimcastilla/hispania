      - name: Require Platform Admin RBAC, safe projections, expiry and partial-failure recovery
        shell: pwsh
        run: |
          dotnet test tests/inventory/Hispania.Inventory.Tests.csproj --no-build --filter "FullyQualifiedName~PlatformAdminProjectionsRequireSessionPermissionsAndExcludePrivateMetadata|FullyQualifiedName~RemoteOnlyCancellationAndTimeoutStayOwnedByPlatformJobStore" --logger "trx;LogFileName=required-platform-admin.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $trx = [xml](Get-Content -Raw tests/inventory/TestResults/required-platform-admin.trx -ErrorAction Stop)
          $results = @($trx.TestRun.Results.UnitTestResult)
          foreach ($pattern in @('*PlatformAdminProjectionsRequireSessionPermissionsAndExcludePrivateMetadata*', '*RemoteOnlyCancellationAndTimeoutStayOwnedByPlatformJobStore*')) {
            if (@($results | Where-Object { $_.testName -like $pattern -and $_.outcome -eq 'Passed' }).Count -ne 1) { throw "Required Admin/Job test '$pattern' must be discovered and pass." }
          }
          if (@($results | Where-Object { $_.outcome -ne 'Passed' }).Count -ne 0) { throw 'Platform Admin tests must pass without skips.' }
      - name: Require Platform Admin Web permissions and Modern/Classic parity
