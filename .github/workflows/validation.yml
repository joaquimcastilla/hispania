        env:
          HISPANIA_TEST_WINDOWS_JOB_OBJECT: "1"
        shell: pwsh
        run: |
          dotnet test tests/unit/Hispania.Runtime.Tests.csproj --no-restore --filter FullyQualifiedName~OutOfProcessGreetingRunsThroughPublicContractAndRecoversAfterWorkerCrash --logger "trx;LogFileName=required-windows-job-object.trx"
