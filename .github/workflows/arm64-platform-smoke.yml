name: ARM64 Platform-only smoke

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: hispania-arm64-platform-smoke
  cancel-in-progress: false

jobs:
  platform-smoke:
    if: github.actor == 'joaquimcastilla' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, hispania-arm64]
    timeout-minutes: 15
    steps:
      - name: Verify runner, runtime and provisioned smoke script
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          test "$(uname -m)" = aarch64
          dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App 10\.'
          test -r /opt/hispania-ci/artifacts/hispania-platform-linux-arm64-step2-working-tree-20261011.tar.gz
          test -r /opt/hispania-ci/scripts/arm64-platform-smoke.sh
          test "$(sha256sum /opt/hispania-ci/scripts/arm64-platform-smoke.sh | cut -d' ' -f1)" = b3e3d0d74be88e22992cdd3885a5afe6d3f434b6c3d5cd3dbb709b0c2dbc35ec

      - name: Run isolated native smoke
        shell: bash
        env:
          HISPANIA_ARTIFACT_SHA256: FC47A9AA2F928EB290FD40CED1B9B6A173F6FFE87E60F13BA5EAC467B5A24C3D
        run: bash /opt/hispania-ci/scripts/arm64-platform-smoke.sh
