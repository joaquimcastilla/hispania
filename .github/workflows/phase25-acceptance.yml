name: Phase 25 Release Acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full SHA of the exact Step 2.1 candidate commit to validate.
        required: true
        type: string
      deterministic_zip_only:
        description: Run the hosted deterministic ZIP matrix and skip the existing self-hosted Phase 25 job.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase25-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-package:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha && inputs.deterministic_zip_only != true
    runs-on: [self-hosted, Linux, X64, hispania, hispania-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize Phase 25 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/phase25/diagnostics
          {
            printf 'runner=%s\nuser=%s\nhome=%s\n' "$RUNNER_NAME" "$(id -un)" "$HOME"
            uname -a
            printf 'DOTNET_ROOT=%s\nDOTNET_INSTALL_DIR=%s\n' "${DOTNET_ROOT:-<unset>}" "${DOTNET_INSTALL_DIR:-<unset>}"
          } > .artifacts/phase25/diagnostics/runner-context.txt
      - name: Detect runner .NET installation
        id: dotnet
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner user: %s\nHOME: %s\n' "$(id -un)" "$HOME"
          printf 'DOTNET_ROOT=%s\n' "${DOTNET_ROOT:-<unset>}"
          printf 'DOTNET_INSTALL_DIR=%s\n' "${DOTNET_INSTALL_DIR:-<unset>}"
          dotnet_path="$(command -v dotnet || true)"
          if [[ -n "$dotnet_path" ]]; then
            printf 'dotnet executable: %s\n' "$dotnet_path"
            dotnet --info
            printf '%s\n' 'Installed SDKs:'
            dotnet --list-sdks
            printf '%s\n' 'Installed runtimes:'
            dotnet --list-runtimes
            if dotnet --list-sdks | awk '$1 == "10.0.401" { found=1 } END { exit !found }' && \
               dotnet --list-runtimes | awk '$1 == "Microsoft.AspNetCore.App" && $2 ~ /^10\./ { found=1 } END { exit !found }'; then
              dotnet_root="$(dirname "$(readlink -f "$dotnet_path")")"
              echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
              echo "$dotnet_root" >> "$GITHUB_PATH"
              echo 'use_existing=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo 'dotnet is not available on PATH.'
          fi
          echo 'use_existing=false' >> "$GITHUB_OUTPUT"
      - name: Install pinned .NET SDK in runner temp
        if: steps.dotnet.outputs.use_existing != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/hispania-dotnet
      - name: Configure private .NET environment
        if: steps.dotnet.outputs.use_existing != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet_root='${{ runner.temp }}/hispania-dotnet'
          test -x "$dotnet_root/dotnet"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      - name: Verify pinned .NET SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = '10.0.401'
          dotnet --info
          dotnet --list-runtimes
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Web build dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build Linux distribution package
        shell: pwsh
        run: ./tools/publish-production.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase25/linux-x64
      - name: Verify exact clean source and package manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw .artifacts/phase25/linux-x64/artifact-manifest.json | ConvertFrom-Json
          if ($manifest.sourceDirty -ne $false -or $manifest.gitSha -cne $env:GITHUB_SHA -or $manifest.targetRid -cne 'linux-x64') { throw 'Package must identify this exact clean Linux workflow commit.' }
      - name: Repeat publication and compare bytes
        shell: pwsh
        run: |
          ./tools/publish-production.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase25-repeat/linux-x64 -SkipWebBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify-production-reproducibility.ps1 -FirstDirectory .artifacts/phase25/linux-x64 -SecondDirectory .artifacts/phase25-repeat/linux-x64
      - name: Verify executable install scripts survive ZIP packaging
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead('.artifacts/phase25/linux-x64.zip')
          try {
            $entry = $archive.GetEntry('operations/install-systemd.sh')
            if ($null -eq $entry -or (([uint32]$entry.ExternalAttributes -shr 16) -band 0x49) -eq 0) { throw 'Linux installation script execute permission is missing from the ZIP.' }
          } finally { $archive.Dispose() }
      - name: Verify the clean package without starting a shared-port service
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('hispania-phase25-' + [guid]::NewGuid().ToString('N'))
          $installHome = Join-Path $root 'home'
          try {
            dotnet .artifacts/phase25/linux-x64/deployment/Hispania.Deployment.dll install (Join-Path $PWD '.artifacts/phase25/linux-x64') $installHome server
            if ($LASTEXITCODE -ne 0) { throw 'Native package install failed.' }
            dotnet (Join-Path $installHome 'app/server/Hispania.Server.dll') --home $installHome --check
            if ($LASTEXITCODE -ne 0) { throw 'Installed Linux Server --check failed.' }
            if (-not (Test-Path (Join-Path $installHome 'config/production.json'))) { throw 'Installed package configuration is missing.' }
          } finally { if (Test-Path $root) { Remove-Item -LiteralPath $root -Recurse -Force } }
      - name: Capture Linux build diagnostics
        if: always()
        shell: bash
        run: |
          diagnostics=.artifacts/phase25/diagnostics
          mkdir -p "$diagnostics"
          {
            dotnet --info || true
            dotnet --list-sdks || true
            dotnet --list-runtimes || true
            node --version || true
            npm --version || true
          } > "$diagnostics/tool-versions.txt" 2>&1
          if [[ -d "$HOME/.npm/_logs" ]]; then
            mapfile -t npm_logs < <(find "$HOME/.npm/_logs" -type f -name '*-debug-0.log' -printf '%T@ %p\n' | sort -nr | head -n 5 | cut -d' ' -f2-)
            for log in "${npm_logs[@]}"; do
              cp -- "$log" "$diagnostics/$(basename "$log")" || true
            done
          fi
      - name: Preserve Phase 25 Linux evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase25-linux-native-package
          include-hidden-files: true
          path: .artifacts/phase25

  hosted-deterministic-zip:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'joaquimcastilla/hispania' && github.actor == 'joaquimcastilla' && github.triggering_actor == 'joaquimcastilla' && github.ref == 'refs/heads/codex/hispania-0.7.0-step2-1-production-readiness' && inputs.candidate_sha == github.sha && inputs.deterministic_zip_only == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source-a
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source-b
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: source-a/apps/web/package-lock.json
      - name: Run deterministic ZIP regression tests on hosted OS
        working-directory: source-a
        run: dotnet test tests/deterministic-zip/Hispania.DeterministicZip.Tests.csproj --configuration Release --verbosity minimal
      - name: Verify exact source commit and clean independent checkouts
        shell: pwsh
        run: |
          foreach ($root in @('source-a','source-b')) {
            $sha = (& git -C $root rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA) { throw "Checkout SHA mismatch in $root." }
            if (@(& git -C $root status --porcelain --untracked-files=normal).Count -ne 0) { throw "Checkout is not clean: $root" }
          }
          if ((dotnet --version) -cne '10.0.401') { throw 'Unexpected .NET SDK version.' }
          "runner=$env:RUNNER_OS rid=${{ matrix.rid }} source_sha=$env:GITHUB_SHA sdk=$(dotnet --version)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Install locked web dependencies for independent build A
        working-directory: source-a/apps/web
        run: npm ci
      - name: Install locked web dependencies for independent build B
        working-directory: source-b/apps/web
        run: npm ci
      - name: Build and package A
        shell: pwsh
        run: ./source-a/tools/publish-production.ps1 -Rid '${{ matrix.rid }}' -OutputDirectory .artifacts/build-a/${{ matrix.rid }}
      - name: Build and package B independently
        shell: pwsh
        run: ./source-b/tools/publish-production.ps1 -Rid '${{ matrix.rid }}' -OutputDirectory .artifacts/build-b/${{ matrix.rid }}
      - name: Verify tree, manifest, ZIP bytes, metadata and clean install
        shell: pwsh
        run: |
          ./source-a/tools/verify-production-reproducibility.ps1 -FirstDirectory .artifacts/build-a/${{ matrix.rid }} -SecondDirectory .artifacts/build-b/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content -Raw .artifacts/build-a/${{ matrix.rid }}/artifact-manifest.json | ConvertFrom-Json
          if ($manifest.sourceDirty -ne $false -or $manifest.gitSha -cne $env:GITHUB_SHA -or $manifest.targetRid -cne '${{ matrix.rid }}') { throw 'Artifact provenance does not match the exact clean source and requested RID.' }
          $root = Join-Path $env:RUNNER_TEMP ('hispania-deterministic-zip-' + [guid]::NewGuid().ToString('N'))
          $extractA = Join-Path $root 'extract-a'
          $extractB = Join-Path $root 'extract-b'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path $extractA,$extractB -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          try {
            if ($env:RUNNER_OS -eq 'Linux') {
              & unzip -q '.artifacts/build-a/${{ matrix.rid }}.zip' -d $extractA
              if ($LASTEXITCODE -ne 0) { throw 'Could not extract ZIP A with the standard Linux unzip tool.' }
              & unzip -q '.artifacts/build-b/${{ matrix.rid }}.zip' -d $extractB
              if ($LASTEXITCODE -ne 0) { throw 'Could not extract ZIP B with the standard Linux unzip tool.' }
              $executeBits = [IO.File]::GetUnixFileMode((Join-Path $extractA 'operations/install-systemd.sh')) -band ([IO.UnixFileMode]::UserExecute -bor [IO.UnixFileMode]::GroupExecute -bor [IO.UnixFileMode]::OtherExecute)
              if ($executeBits -eq 0) { throw 'Standard Linux ZIP extraction did not preserve installation script execute permissions.' }
            } else {
              [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path '.artifacts/build-a/${{ matrix.rid }}.zip'), $extractA)
              [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path '.artifacts/build-b/${{ matrix.rid }}.zip'), $extractB)
            }
            $hashes = { param($path) Get-ChildItem -LiteralPath $path -File -Recurse | ForEach-Object { [pscustomobject]@{ Path=[IO.Path]::GetRelativePath($path,$_.FullName).Replace('\','/'); Hash=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } } | Sort-Object Path }
            $treeA = @(& $hashes $extractA | ForEach-Object { "$($_.Path)|$($_.Hash)" }) -join "`n"
            $treeB = @(& $hashes $extractB | ForEach-Object { "$($_.Path)|$($_.Hash)" }) -join "`n"
            if ($treeA -cne $treeB) { throw 'Extracted ZIP file trees differ.' }
            $buildTreeA = @(& $hashes (Resolve-Path '.artifacts/build-a/${{ matrix.rid }}') | ForEach-Object { "$($_.Path)|$($_.Hash)" }) -join "`n"
            $buildTreeB = @(& $hashes (Resolve-Path '.artifacts/build-b/${{ matrix.rid }}') | ForEach-Object { "$($_.Path)|$($_.Hash)" }) -join "`n"
            if ($treeA -cne $buildTreeA -or $treeB -cne $buildTreeB) { throw 'Extracted ZIP content does not match its publication tree.' }
            $treeFiles = @(Get-ChildItem -LiteralPath $extractA -File -Recurse).Count
            if ('${{ matrix.rid }}' -eq 'linux-arm64') {
              if ($manifest.architecture -cne 'aarch64' -or $manifest.runtimePrerequisite -cne 'ASP.NET Core Runtime 10.0 (ARM64)') { throw 'ARM64 artifact architecture/runtime metadata is invalid.' }
              dotnet source-a/apps/deployment/bin/Release/net10.0/Hispania.Deployment.dll verify $extractA
              if ($LASTEXITCODE -ne 0) { throw 'Host-native verification of the ARM64 artifact failed.' }
            } else {
              dotnet (Join-Path $extractA 'deployment/Hispania.Deployment.dll') verify $extractA
              if ($LASTEXITCODE -ne 0) { throw 'ArtifactManifest verification failed on the extracted ZIP.' }
              $installHome = Join-Path $root 'home'
              dotnet (Join-Path $extractA 'deployment/Hispania.Deployment.dll') install $extractA $installHome server
              if ($LASTEXITCODE -ne 0) { throw 'Clean package installation failed.' }
              dotnet (Join-Path $installHome 'app/server/Hispania.Server.dll') --home $installHome --check
              if ($LASTEXITCODE -ne 0) { throw 'Installed Server --check failed.' }
            }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead('.artifacts/build-a/${{ matrix.rid }}.zip')
          try {
            if ('${{ matrix.rid }}' -like 'linux-*') {
              $entry = $archive.GetEntry('operations/install-systemd.sh')
              if ($null -eq $entry -or (([uint32]$entry.ExternalAttributes -shr 16) -band 0x49) -eq 0) { throw 'Linux install script lost execute permission.' }
            }
          } finally { $archive.Dispose() }
          $zipHash = (Get-FileHash .artifacts/build-a/${{ matrix.rid }}.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHashB = (Get-FileHash .artifacts/build-b/${{ matrix.rid }}.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash .artifacts/build-a/${{ matrix.rid }}/artifact-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHashB = (Get-FileHash .artifacts/build-b/${{ matrix.rid }}/artifact-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -cne $manifestHashB) { throw 'Artifact manifest bytes differ.' }
          "rid=${{ matrix.rid }} runner=$env:RUNNER_OS sdk=$(dotnet --version) packer=Hispania.DeterministicZip zip_method=Store file_count=$treeFiles zip_a_sha256=$zipHash zip_b_sha256=$zipHashB manifest_a_sha256=$manifestHash manifest_b_sha256=$manifestHashB extracted_tree_equal=true install_checked=${{ matrix.rid != 'linux-arm64' }}" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } finally { if (Test-Path $root) { Remove-Item -LiteralPath $root -Recurse -Force } }
      - name: Preserve deterministic ZIP evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase25-deterministic-zip-${{ matrix.rid }}
          include-hidden-files: true
          path: |
            .artifacts/build-a/${{ matrix.rid }}.zip
            .artifacts/build-a/${{ matrix.rid }}.zip.sha256
            .artifacts/build-b/${{ matrix.rid }}.zip
            .artifacts/build-b/${{ matrix.rid }}.zip.sha256
            .artifacts/build-a/${{ matrix.rid }}/artifact-manifest.json
            .artifacts/build-a/${{ matrix.rid }}.manifest.sha256
            .artifacts/build-a/${{ matrix.rid }}.build-evidence.json
            .artifacts/build-b/${{ matrix.rid }}/artifact-manifest.json
            .artifacts/build-b/${{ matrix.rid }}.manifest.sha256
            .artifacts/build-b/${{ matrix.rid }}.build-evidence.json
