name: Phase 25 Release Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase25-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-package:
    if: github.repository == 'joaquimcastilla/hispania' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hispania, hispania-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Build Linux distribution package
        shell: pwsh
        run: ./tools/publish-production.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase25/linux-x64
      - name: Verify exact clean source and package manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw .artifacts/phase25/linux-x64/artifact-manifest.json | ConvertFrom-Json
          if ($manifest.sourceDirty -ne $false -or $manifest.gitSha -cne $env:GITHUB_SHA -or $manifest.targetRid -cne 'linux-x64') { throw 'Package must identify this exact clean Linux workflow commit.' }
      - name: Repeat publication and compare bytes
        shell: pwsh
        run: |
          ./tools/publish-production.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase25-repeat/linux-x64 -SkipWebBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify-production-reproducibility.ps1 -FirstDirectory .artifacts/phase25/linux-x64 -SecondDirectory .artifacts/phase25-repeat/linux-x64
      - name: Install and run the clean package natively
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('hispania-phase25-' + [guid]::NewGuid().ToString('N'))
          $home = Join-Path $root 'home'
          try {
            dotnet .artifacts/phase25/linux-x64/deployment/Hispania.Deployment.dll install (Join-Path $PWD '.artifacts/phase25/linux-x64') $home server
            if ($LASTEXITCODE -ne 0) { throw 'Native package install failed.' }
            dotnet (Join-Path $home 'app/server/Hispania.Server.dll') --home $home --check
            if ($LASTEXITCODE -ne 0) { throw 'Installed Linux Server --check failed.' }
            $config = Join-Path $home 'config/production.json'
            $settings = Get-Content -Raw $config | ConvertFrom-Json -AsHashtable
            $settings['server'] = @{ urls = 'http://127.0.0.1:28765' }
            $settings['web'] = @{ build = 'modern' }
            $settings['logging'] = @{ logLevel = 'Warning' }
            $settings | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $config -Encoding utf8NoBOM
            $proc = Start-Process -FilePath 'dotnet' -ArgumentList @((Join-Path $home 'app/server/Hispania.Server.dll'), '--home', $home) -WorkingDirectory $env:RUNNER_TEMP -PassThru
            try {
              $ready = $false
              for ($i=0; $i -lt 60; $i++) {
                if ($proc.HasExited) { throw "Installed Server exited early ($($proc.ExitCode))." }
                try { $response = Invoke-WebRequest -Uri 'http://127.0.0.1:28765/' -TimeoutSec 2; if ($response.StatusCode -eq 200) { $ready = $true; break } } catch { }
                Start-Sleep -Seconds 1
              }
              if (-not $ready) { throw 'Installed Server did not become HTTP ready within 60 seconds.' }
              if (-not (Test-Path (Join-Path $home 'state/platform/identity.sqlite'))) { throw 'Installed Server did not create durable identity state.' }
              Stop-Process -Id $proc.Id
              $proc.WaitForExit()
            } finally { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force } }
          } finally { if (Test-Path $root) { Remove-Item -LiteralPath $root -Recurse -Force } }
      - name: Preserve Phase 25 Linux evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase25-linux-native-package
          include-hidden-files: true
          path: .artifacts/phase25
