name: Phase 25 Release Acceptance

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Reproducible Phase 24 smoke campaign seed
        required: true
        type: string
        default: '25001'

permissions:
  contents: read

concurrency:
  group: phase25-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: github.repository == 'joaquimcastilla/hispania' && github.ref == 'refs/heads/feature/phase-25-final-integration-release-readiness'
    runs-on: [self-hosted, Linux, X64, hispania, hispania-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build Modern and Classic Web Shells
        working-directory: apps/web
        run: npm ci && npm run build && npm test
      - name: Build and verify linux-x64 distribution artifact
        shell: pwsh
        run: ./tools/publish-production.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase25/linux-x64
      - name: Build the exact preserved Phase 17 upgrade predecessor
        shell: pwsh
        run: ./tools/publish-phase17-predecessor.ps1 -Rid linux-x64 -OutputDirectory .artifacts/phase25/predecessor-linux-x64
      - name: Test clean-artifact startup, persistence, upgrade, rollback and mTLS WorkerAgent
        shell: pwsh
        env:
          HISPANIA_PHASE18_ARTIFACT: ${{ github.workspace }}/.artifacts/phase25/linux-x64
          HISPANIA_PHASE18_PREDECESSOR: ${{ github.workspace }}/.artifacts/phase25/predecessor-linux-x64
        run: dotnet test tests/deployment-process/Hispania.Deployment.ProcessTests.csproj --filter "FullyQualifiedName~ArtifactProcessTests|FullyQualifiedName~WorkerDeploymentTests|FullyQualifiedName~PackageDistributionUpgradeTests|FullyQualifiedName~DistributedWorkerProcessIntegrationTests|FullyQualifiedName~DistributedCoordinatorPersistenceTests" --logger "trx;LogFileName=phase25-process.trx"
      - name: Test Phase 24 bounded recovery and cleanup
        shell: pwsh
        env:
          PHASE25_SEED: ${{ inputs.seed }}
        run: |
          dotnet test tests/inventory/Hispania.Inventory.Tests.csproj --filter FullyQualifiedName~Phase24ResilienceTests --logger "trx;LogFileName=phase25-resilience.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test-phase24-operational-resilience.ps1 -Profile Smoke -Seed ([int]$env:PHASE25_SEED) -OutputDirectory .artifacts/phase25/linux-smoke
      - name: Preserve acceptance and distribution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase25-linux-x64
          include-hidden-files: true
          path: |
            .artifacts/phase25
            tests/deployment-process/TestResults/phase25-process.trx
            tests/inventory/TestResults/phase25-resilience.trx

  windows:
    if: github.repository == 'joaquimcastilla/hispania' && github.ref == 'refs/heads/feature/phase-25-final-integration-release-readiness'
    runs-on: [self-hosted, Windows, X64, hispania, hispania-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build Modern and Classic Web Shells
        working-directory: apps/web
        run: npm ci; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm test
      - name: Build and verify win-x64 distribution artifact
        shell: pwsh
        run: ./tools/publish-production.ps1 -Rid win-x64 -OutputDirectory .artifacts/phase25/win-x64
      - name: Build the exact preserved Phase 17 upgrade predecessor
        shell: pwsh
        run: ./tools/publish-phase17-predecessor.ps1 -Rid win-x64 -OutputDirectory .artifacts/phase25/predecessor-win-x64
      - name: Test clean-artifact startup, persistence, upgrade, rollback and mTLS WorkerAgent
        shell: pwsh
        env:
          HISPANIA_PHASE18_ARTIFACT: ${{ github.workspace }}/.artifacts/phase25/win-x64
          HISPANIA_PHASE18_PREDECESSOR: ${{ github.workspace }}/.artifacts/phase25/predecessor-win-x64
        run: dotnet test tests/deployment-process/Hispania.Deployment.ProcessTests.csproj --filter "FullyQualifiedName~ArtifactProcessTests|FullyQualifiedName~WorkerDeploymentTests|FullyQualifiedName~PackageDistributionUpgradeTests|FullyQualifiedName~DistributedWorkerProcessIntegrationTests|FullyQualifiedName~DistributedCoordinatorPersistenceTests" --logger "trx;LogFileName=phase25-process.trx"
      - name: Test Phase 24 bounded recovery and cleanup
        shell: pwsh
        env:
          PHASE25_SEED: ${{ inputs.seed }}
        run: |
          dotnet test tests/inventory/Hispania.Inventory.Tests.csproj --filter FullyQualifiedName~Phase24ResilienceTests --logger "trx;LogFileName=phase25-resilience.trx"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test-phase24-operational-resilience.ps1 -Profile Smoke -Seed ([int]$env:PHASE25_SEED) -OutputDirectory .artifacts/phase25/windows-smoke
      - name: Preserve acceptance and distribution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase25-windows-x64
          include-hidden-files: true
          path: |
            .artifacts/phase25
            tests/deployment-process/TestResults/phase25-process.trx
            tests/inventory/TestResults/phase25-resilience.trx
